name: CI

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "agents/**"
      - "examples/**"
      - "AGENTS.md"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/**"
      - ".gitleaks.toml"
      - ".markdownlint*"
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "agents/**"
      - "examples/**"
      - "AGENTS.md"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/**"
      - ".gitleaks.toml"
      - ".markdownlint*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint skills
        run: scripts/lint-skills
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Sync script tests
        run: bash tests/sync/test_sync.sh

  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            **/*.md
            !tests/**/fixtures/**

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck scripts/sync tests/sync/*.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Warning,Error
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Output
            exit 1
          }

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Init Azure sample
        working-directory: examples/jstack-sample/terraform/azure
        run: terraform init -backend=false -input=false
      - name: Test Azure sample
        working-directory: examples/jstack-sample/terraform/azure
        run: terraform test
      - name: Init AWS sample
        working-directory: examples/jstack-sample/terraform/aws
        run: terraform init -backend=false -input=false
      - name: Test AWS sample
        working-directory: examples/jstack-sample/terraform/aws
        run: terraform test
