name: Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/render-docs.py"
      - "skills/**"
      - "docs/writing-skills.md"
      - "docs/operator-guide.md"
      - "docs/templates/SKILL.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install docs tools
        run: python3 -m pip install -r requirements-docs.txt
      - name: Render pages
        run: python3 scripts/render-docs.py
      - name: Build the site
        run: python3 -m mkdocs build --strict

  # Deploy stays off. This repository is private, and a published Pages site
  # on the current plan is public. Issue 5 records that choice before this
  # job is enabled. Enabling it also needs the build job to upload site-dist
  # with actions/upload-pages-artifact. Jobs do not share a workspace, so the
  # upload below finds nothing until that move. A skipped job publishes nothing.
  # When deploy is turned on, set cancel-in-progress to false so a second push
  # does not cancel a publish.
  deploy:
    if: false
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload the site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
