site_name: jstack
site_description: DevOps skills for Azure, AWS, Terraform, and the pipelines that ship them.
site_url: https://jaycommit.github.io/jstack/
repo_url: https://github.com/JayCommit/jstack
repo_name: JayCommit/jstack
docs_dir: site
site_dir: site-dist
strict: true
theme:
  name: material
  font: false
  palette:
    scheme: slate
    primary: black
    accent: indigo
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/finder.js
plugins:
  - search
nav:
  - Home: index.md
  - Guide:
      - How it works: how-it-works.md
      - Day to day: day-to-day.md
      - Secure defaults: secure-defaults.md
      - Writing a skill: writing-a-skill.md
  - Install:
      - Overview: install/index.md
      - Cursor: install/cursor.md
      - GitHub Copilot: install/copilot.md
      - Other agents: install/other-agents.md
      - Remove: install/remove.md
  - Examples:
      - Overview: examples/index.md
      - Review a Terraform plan: examples/plan-review.md
      - Federate a pipeline to Azure: examples/federate-azure.md
      - Create a private AKS cluster: examples/private-aks.md
      - Triage Terraform drift: examples/drift.md
      - Price an Azure change: examples/azure-cost.md
      - A failing pipeline: examples/failing-pipeline.md
      - Raise a ServiceNow change: examples/servicenow-change.md
  - Skills: catalog.md
